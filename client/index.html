<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solvenera — Turn your need into a practical solution</title>
    <meta name="description" content="Solvenera connects you with verified service providers and community resources to turn everyday needs into practical solutions." />
    <meta name="keywords" content="solvenera, service providers, community resources, needs, solutions, local services, repair, tuition" />
    <meta name="theme-color" content="#059669" />
    <meta property="og:title" content="Solvenera — Turn your need into a practical solution" />
    <meta property="og:description" content="Find the right service, resource, or skilled person — and when the usual solution isn't available, discover relevant alternatives from the community." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" rel="stylesheet" />
    <script>
      // Apply saved theme before first paint to prevent flash
      (function() {
        try {
          var saved = localStorage.getItem('solvenera_theme');
          var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
          document.documentElement.className = theme;
        } catch(e) {
          document.documentElement.className = 'dark';
        }
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
