services:
  # ─────────────────────────────────────────────
  # Backend API — Node.js Web Service
  # ─────────────────────────────────────────────
  - type: web
    name: solvenera-api
    runtime: node
    region: singapore  # Change to your preferred region
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false          # Set this manually in Render dashboard
      - key: JWT_ACCESS_SECRET
        sync: false          # Set this manually in Render dashboard
      - key: JWT_REFRESH_SECRET
        sync: false          # Set this manually in Render dashboard
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false          # Set this manually — your frontend URL(s)
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      - key: ADMIN_EMAIL
        sync: false          # Set this manually in Render dashboard
      - key: ADMIN_PASSWORD
        sync: false          # Set this manually in Render dashboard

  # ─────────────────────────────────────────────
  # Frontend — Static Site (React/Vite)
  # ─────────────────────────────────────────────
  - type: web
    name: solvenera-client
    runtime: static
    region: singapore
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false          # Set to: https://solvenera-api.onrender.com/api/v1
      - key: VITE_APP_NAME
        value: Solvenera
